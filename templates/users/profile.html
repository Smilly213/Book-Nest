{% extends 'base.html' %}

{% block title %}{{ profile.full_name }}{% endblock %}

{% block content %}
    {% if profile.image %}
        <img src="{{ profile.image.url }}">
    {% endif %}
    <p>{{ profile.full_name }}</p>
    <p>{{ profile.data }}</p>
    <p>{{ profile.age }}</p>
    <p>{{ profile.context }}</p>
{% endblock %}

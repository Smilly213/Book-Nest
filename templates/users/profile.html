{% extends 'base.html' %}

{% block title %}{{ profile.full_name }}{% endblock %}

{% block content %}
    {% if profile.image %}
        <img src="{{ profile.image.url }}">
    {% endif %}
    <p><h3>Имя: {{ profile.full_name }}</h3></p>
    <p><h4>Возраст: {{ profile.age }}</h4></p>
    <p><h3>Описание: {{ profile.context }}</h3></p>
{% endblock %}

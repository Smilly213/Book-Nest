{% extends 'base.html' %}

{% block title %}{{ profile.full_name }}{% endblock %}

{% block content %}
    {% if profile.image %}
        <img src="{{ profile.image.url }}" alt="{{ profile.full_name }}">
    {% endif %}
    {{ profile.full_name }}
    {{ profile.data }}
    {{ profile.age }}
    {{ profile.context }}
{% endblock %}
